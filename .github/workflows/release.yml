name: Build and publish release installers

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -m pip install Pillow

      - name: Build installer
        run: python packager.py

      - name: Sign Windows executables
        if: runner.os == 'Windows'
        shell: powershell
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_CERTIFICATE -or -not $env:WINDOWS_SIGNING_PASSWORD) {
            throw "Windows signing secrets are required for release builds."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "drunkenbot-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE)
          )
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw "signtool.exe was not found on the Windows runner."
          }
          $files = @(
            Get-ChildItem "packaging\artifacts" -Recurse -File |
              Where-Object { $_.Extension -in ".exe", ".msi" }
          )
          if ($files.Count -eq 0) {
            throw "No Windows executables were produced to sign."
          }
          foreach ($file in $files) {
            & $signTool.FullName sign /fd SHA256 /f $certificatePath `
              /p $env:WINDOWS_SIGNING_PASSWORD /tr http://timestamp.digicert.com `
              /td SHA256 $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $($file.FullName)."
            }
          }
          Remove-Item $certificatePath -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.artifact }}
          path: packaging/artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
